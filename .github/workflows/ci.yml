name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tipos · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Corepack lee `packageManager: pnpm@10.12.4` del package.json raíz
      # y fija exactamente esa versión (sin depender de acciones externas).
      - name: Habilitar pnpm (corepack)
        run: corepack enable

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Tests (vitest)
        run: pnpm test

      - name: Typecheck (todos los paquetes)
        run: pnpm typecheck

      - name: Build del cliente (Vite)
        run: pnpm build
